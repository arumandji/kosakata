<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamus Kosakata Jepang - Minna no Nihongo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tombol Hamburger (Sidebar) di Kiri Atas -->
    <button id="hamburgerBtn" class="hamburger-btn" title="Buka Menu">☰</button>
    
    <!-- Tombol Dark Mode di Kanan Atas -->
    <button id="darkModeToggle" class="dark-mode-btn" title="Ganti Mode Gelap/Terang">🌙</button>

    <!-- Overlay Latar Belakang saat Sidebar Terbuka -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar / Laci Menu Samping -->
    <div id="appSidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>🐱 Menu Utama</h3>
            <button id="closeSidebarBtn" class="close-btn">&times;</button>
        </div>
        <div class="sidebar-menu">
            <a href="#" onclick="switchMenu('vocab'); closeSidebar();">Kosakata (Bab 1-25)</a>
            <a href="#" onclick="switchMenu('kana'); closeSidebar();">Hiragana & Katakana</a>
        </div>
    </div>

    <!-- Kontainer Utama Aplikasi -->
    <div class="container">
        
        <!-- Bagian Utama Kosakata -->
        <div id="vocabMainSection">
            <h1>Kosakata Jepang</h1>
            <p class="subtitle">Semangat belajarnyaaa, katanya mau ke Jepang</p>

            <!-- Kolom Pencarian -->
            <input type="text" id="searchInput" class="search-box" placeholder="Cari kosakata (arti, romaji, atau kanji)..." onkeyup="filterAndRender()">

            <!-- Bagian Filter Bab (Dropdown) -->
            <div class="filter-container">
                <label for="babFilter" style="font-weight: 600; font-size: 13px; margin-right: 10px;">Pilih Bab:</label>
                <select id="babFilter" onchange="onDropdownChange()" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc; width: 100%; max-width: 250px;">
                    <option value="ALL">Semua Bab (1 - 25)</option>
                </select>
            </div>

            <!-- Deretan Tombol (Pill Buttons) -->
            <div id="babButtons" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px;">
                <button onclick="filterByBab('ALL')" class="bab-btn" data-bab="ALL" style="padding: 6px 14px; border-radius: 20px; border: 1px solid #d9534f; background: #d9534f; color: white; cursor: pointer; white-space: nowrap; font-size: 13px;">Semua</button>
            </div>

            <!-- Tempat Kosakata Muncul Otomatis -->
            <div id="vocabList"></div>
        </div>

        <!-- Container untuk Tabel Hiragana & Katakana (Awalnya tersembunyi) -->
        <div id="kanaContainer" style="display: none;"></div>

    </div>

    <!-- Maskot Kucing Mengambang di Pojok Kanan Bawah -->
    <div class="floating-mascot">
        <img src="kucing3.png" alt="Maskot Kucing Ganbatte" style="width: 110px; height: auto;">
    </div>

    <!-- Footer Web Kamus -->
    <footer style="text-align: center; margin-top: 40px; padding: 20px 0; color: #888; font-size: 12px; border-top: 1px solid #eee;">
        <p>&copy; 2026 Yuro Arumandji. All rights reserved.</p>
        <p>Licensed under the <a href="LICENSE" target="_blank" style="color: #d9534f; text-decoration: none;">MIT License</a>.</p>
    </footer>

    <!-- Panggil file data kosakata -->
    <script src="vocab.js"></script>
    <!-- Panggil file logika JavaScript utama -->
    <script src="script.js"></script>
</body>
</html>
