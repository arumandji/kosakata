<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamus Kosakata Jepang - Minna no Nihongo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #d9534f;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .vocab-card {
            background: #fafafa;
            border-left: 5px solid #d9534f;
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }
        .vocab-card:hover {
            transform: translateY(-2px);
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .jp {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
        }
        .romaji {
            font-size: 12px;
            color: #888;
        }
        .badge {
            font-size: 12px;
            background: #ffebee;
            color: #d9534f;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🇯🇵 Kosakata Jepang</h1>
        <p class="subtitle">Persiapan Berangkat ke Jepang 🚀</p>

        <!-- Kolom Pencarian -->
        <input type="text" id="searchInput" class="search-box" placeholder="Cari kosakata..." onkeyup="renderVocab()">

        <!-- Tempat Kosakata Muncul Otomatis -->
        <div id="vocabList"></div>
    </div>

    <!-- Panggil file JavaScript eksternal -->
    <script src="vocab.js"></script>

</body>
</html>
